<text x="990" y="398" fill="#cbd5e1" font-family="Arial" font-size="16" text-anchor="middle">Channels 1–13</text>
<text x="990" y="423" fill="#cbd5e1" font-family="Arial" font-size="16" text-anchor="middle">OLED bar display</text>

<rect x="250" y="530" width="300" height="100" rx="18" fill="#111827" stroke="#00d9ff" stroke-width="2"/>
<text x="400" y="568" fill="#fff" font-family="Arial" font-size="21" text-anchor="middle" font-weight="700">SH1106 OLED</text>
<text x="400" y="600" fill="#cbd5e1" font-family="Arial" font-size="16" text-anchor="middle">I²C: SDA 21 • SCL 22</text>

<rect x="650" y="530" width="300" height="100" rx="18" fill="#111827" stroke="#00d9ff" stroke-width="2"/>
<text x="800" y="568" fill="#fff" font-family="Arial" font-size="21" text-anchor="middle" font-weight="700">3-Button Controls</text>
<text x="800" y="600" fill="#cbd5e1" font-family="Arial" font-size="16" text-anchor="middle">UP 32 • DOWN 33 • SELECT 25</text>

