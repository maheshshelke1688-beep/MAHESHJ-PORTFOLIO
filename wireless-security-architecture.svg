<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#0b0f19"/>
<text x="600" y="55" fill="#00d9ff" font-family="Arial" font-size="30" text-anchor="middle" font-weight="700">Wireless Security Analyzer — System Architecture</text>

<rect x="425" y="105" width="350" height="120" rx="18" fill="#111827" stroke="#00d9ff" stroke-width="2"/>
<text x="600" y="145" fill="#fff" font-family="Arial" font-size="24" text-anchor="middle" font-weight="700">ESP32 Controller</text>
<text x="600" y="178" fill="#cbd5e1" font-family="Arial" font-size="17" text-anchor="middle">Application state + main loop</text>
<text x="600" y="202" fill="#cbd5e1" font-family="Arial" font-size="15" text-anchor="middle">WirelessSecurityAnalyzer.ino / appState</text>

<rect x="60" y="300" width="300" height="145" rx="18" fill="#111827" stroke="#00d9ff" stroke-width="2"/>
<text x="210" y="340" fill="#fff" font-family="Arial" font-size="22" text-anchor="middle" font-weight="700">Wi-Fi Scanner</text>
<text x="210" y="373" fill="#cbd5e1" font-family="Arial" font-size="16" text-anchor="middle">Network discovery</text>
<text x="210" y="398" fill="#cbd5e1" font-family="Arial" font-size="16" text-anchor="middle">SSID • RSSI • Channel</text>
<text x="210" y="423" fill="#cbd5e1" font-family="Arial" font-size="16" text-anchor="middle">Security type</text>

<rect x="450" y="300" width="300" height="145" rx="18" fill="#111827" stroke="#00d9ff" stroke-width="2"/>
<text x="600" y="340" fill="#fff" font-family="Arial" font-size="22" text-anchor="middle" font-weight="700">BLE Scanner</text>
<text x="600" y="373" fill="#cbd5e1" font-family="Arial" font-size="16" text-anchor="middle">Nearby BLE devices</text>
<text x="600" y="398" fill="#cbd5e1" font-family="Arial" font-size="16" text-anchor="middle">Name • MAC • RSSI</text>
<text x="600" y="423" fill="#cbd5e1" font-family="Arial" font-size="16" text-anchor="middle">Duplicate filtering</text>

<rect x="840" y="300" width="300" height="145" rx="18" fill="#111827" stroke="#00d9ff" stroke-width="2"/>
